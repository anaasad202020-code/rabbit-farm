<style>

.stp{display:flex;gap:5px;margin:0 0 8px}
.stp span{flex:1;text-align:center;font-size:12px;padding:6px 2px;border-radius:10px;background:var(--nb);color:var(--mu);border:1px solid var(--ln);white-space:nowrap}

.dd{position:relative}
.ddb{width:100%;min-height:46px;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--ln);border-radius:12px;padding:8px 12px;background:var(--sf);color:var(--ink);font:inherit;text-align:start}

.ddo:last-child{border-bottom:0}
.ddo.sel,.ddo.nw{color:var(--pr);font-weight:700}
.ddn{margin-top:8px}
.dde{padding:14px;color:var(--mu);text-align:center;font-size:14px}
</style>

<script id="app">
(()=>{
'use strict';

const R2=n=>Math.round(n*100)/100,nf=n=>R2(n).toLocaleString('en-US'),money=n=>n==null?'—':nf(n)+' ج.م',pc=n=>n==null?'—':Math.round(n*100)+'%';
const T0=()=>D(todayS());
const NM={br:'تلقيح',does:'أم',bucks:'ذكر',sales:'عملية بيع',exp:'مصروف',cust:'زبون'};

const CFGL=[['FirstTestDays','الأيام حتى الجسة الأولى (بعد التلقيح)','يوم'],['SecondTestDays','الأيام حتى الجسة الثانية','يوم'],['GestationDays','مدة الحمل','يوم'],['MaxBirthDays','أقصى مدة من التلقيح للولادة (للتحقق)','يوم'],['WeaningAge','سن الفطام (من الولادة)','يوم'],['MinWeanDays','أقل مدة بين الولادة والفطام (للتحقق)','يوم'],['BacterialVaccineCycle','دورة التحصين البكتيري','يوم'],['ViralVaccineCycle','دورة التحصين الفيروسي','يوم'],['AlertWindow','نافذة التنبيه المبكر قبل الموعد','يوم'],['TargetSaleWeight','وزن البيع المستهدف','كجم'],['FirstMatingAge','سن جاهزية الأم للتلقيح الأول','يوم'],['MinAttempts','أقل عدد تلقيحات قبل التقييم','مرة'],['GoodRatePct','نسبة النجاح الممتازة','%'],['PoorRatePct','نسبة النجاح الضعيفة (للمراجعة)','%']];
let tab='today',sub={an:'does',acc:'sum'},q='',flt='',pg=1,FS=null;
const S={cfg:{...DEF},ch:{},v:0};for(const t in SCHEMA)S.ch[t]=[[]];
const C={};const memo=(k,fn)=>{const e=C[k];if(e&&e.v===S.v)return e.r;const r=fn();C[k]={v:S.v,r};return r};
const rows=t=>memo('r'+t,()=>[].concat(...S.ch[t]));
const byId=t=>memo('i'+t,()=>{const m=new Map();for(const r of rows(t))m.set(r.id,r);return m});
const codes=t=>memo('c'+t,()=>{const m=Object.create(null);for(const r of rows(t))m[r.c]=r;return m});

/* ---------- storage: IndexedDB on the device ---------- */
let IDB=null,cur='loc',note='';
const revs={},known={};let lossWarn=null,autoMeta=null,okT=0;let ready=false,hasSnap=null,loadErr=null,slow=false,bootStep='',bootMs=0,bootGen=0;
const diag=(()=>{try{return JSON.parse(localStorage.rf_log||'[]').slice(-60)}catch(e){return[]}})();
const dg=m=>{diag.push(new Date().toISOString().slice(5,10)+' '+new Date().toTimeString().slice(0,8)+' '+String(m).slice(0,200));if(diag.length>60)diag.shift();try{localStorage.rf_log=JSON.stringify(diag)}catch(e){}};
const TO=Object.assign({open:8000,read:30000,snap:5000,slow:10000},window.__rfTimeouts||{});
const withT=(p,ms,l)=>Promise.race([p,new Promise((_,no)=>setTimeout(()=>no(new Error('timeout:'+l)),ms))]);
const STEPN={open:'فتح قاعدة البيانات',read:'قراءة السجلات',apply:'تجهيز السجلات',snap:'قراءة نسخة الأمان',render:'عرض الشاشة'};
const skipN={},skipTotal=()=>Object.values(skipN).reduce((a,b)=>a+b,0);
const rowsNow=()=>Object.fromEntries(Object.keys(S.ch).map(t=>[t,S.ch[t].reduce((a,c)=>a+c.length,0)]));
const cntStr=o=>Object.entries(o).map(([k,v])=>k+':'+v).join(' ');
const lastGet=()=>{try{return JSON.parse(localStorage.rf_last||'null')}catch(e){return null}};
const lastSet=o=>{try{localStorage.rf_last=JSON.stringify(o)}catch(e){}};
function lastUpdate(tables,merged){const L=lastGet()||{t:{}};L.t=L.t||{};for(const t of tables)if(merged[t])L.t[t]=merged[t].reduce((a,c)=>a+(Array.isArray(c)?c.length:0),0);L.at=Date.now();lastSet(L)}
function saneRows(t,rs,bump){const out=[];for(const r of rs){
if(!r||typeof r!=='object'||Array.isArray(r)||typeof r.id!=='string'||!r.id){bump();continue}
let c;try{c=clean(t,r)}catch(e){bump();continue}
c.id=r.id;if(SCHEMA[t].some(f=>f[3]&&c[f[0]]==null)){bump();continue}out.push(c)}return out}
function saneCh(t,chunks){let n=0;const out=chunks.map(ch=>saneRows(t,Array.isArray(ch)?ch:[],()=>n++));skipN[t]=n;return out.length?out:[[]]}
const bc=(()=>{try{return new BroadcastChannel('rf-sync')}catch(e){return null}})();
const idbOpen=()=>new Promise((res,rej)=>{try{const q=indexedDB.open('rabbitfarm',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv',{keyPath:'id'});q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}catch(e){rej(e)}});
const idbAll=()=>new Promise((res,rej)=>{const q=IDB.transaction('kv').objectStore('kv').getAll(IDBKeyRange.upperBound('zz',true));q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const idbPut=v=>new Promise((res,rej)=>{const t=IDB.transaction('kv','readwrite');t.objectStore('kv').put(v);t.oncomplete=res;t.onerror=t.onabort=()=>rej(t.error)});
const idbGet=id=>new Promise((res,rej)=>{const q=IDB.transaction('kv').objectStore('kv').get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const readRange=t=>new Promise((res,rej)=>{const q=IDB.transaction('kv').objectStore('kv').getAll(IDBKeyRange.bound(t+'-',t+'-\uffff'));q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const SM={ok:['✓ محفوظ','g'],busy:['… جارٍ الحفظ','y'],loc:['محفوظ على الجهاز فقط','n'],err:['⚠ تعذّر الحفظ','r']};
function setSt(k,m){if(k==='loc'&&!IDB)k='err';cur=k;note=m||'';const p=$('#sync');p.textContent=m||SM[k][0];p.className='pill c-'+SM[k][1]}
function applyDoc(d){if(d.id==='cfg'){S.cfg={...DEF,...d.cfg}}else if(S.ch[d.k]&&Number.isInteger(d.n)&&d.n>=0&&d.n<5000){const a=S.ch[d.k];while(a.length<=d.n)a.push([]);a[d.n]=Array.isArray(d.rows)?d.rows:[]}}
const stamp=id=>{const r=Math.max(Date.now(),Math.floor(revs[id]||0)+1)+Math.random()*.5;revs[id]=r;return r};
const noteDoc=d=>{revs[d.id]=Math.max(revs[d.id]||0,d.rev||0);const k=d.id==='cfg'?'cfg':d.k;(known[k]=known[k]||new Map()).set(d.id,d.rev)};
const chunksFromDocs=docs=>{const c=[];for(const d of docs){const n=d.n;if(!Number.isInteger(n)||n<0||n>=5000)continue;while(c.length<=n)c.push([]);c[n]=Array.isArray(d.rows)?d.rows:[]}return c.length?c:[[]]};
const sameDocs=(t,docs)=>{const k=known[t];if(!k)return docs.length===0;if(k.size!==docs.length)return false;for(const d of docs)if(k.get(d.id)!==d.rev)return false;return true};

/* Every save is recorded as a small operation (put / delete) and applied to the data that is
   ALREADY ON DISK inside one IndexedDB transaction. Transactions are serialised by the browser,
   so several open tabs/windows can never overwrite each other's records. */
const opq=new Map(),replaceT=new Map(),running=[],needSync=new Set();let pendCfg=null,sch=false,failed=false;
const sched=()=>{if(!sch){sch=true;if(IDB&&ready&&cur!=='err')setSt('busy');queueMicrotask(flush)}};
function recOp(t,id,op){let m=opq.get(t);if(!m){m=new Map();opq.set(t,m)}m.set(id,op);sched()}
const qc=()=>{pendCfg={...S.cfg};sched()};
function replaceTable(t,rs){opq.delete(t);replaceT.set(t,rs.slice());sched()}
function memPut(t,r){const p=locate(t,r.id);if(p){S.ch[t][p[0]][p[1]]=r;return}const a=S.ch[t];let l=a[a.length-1];if(!l||l.length>=CH){l=[];a.push(l)}l.push(r)}
function memDel(t,id){const p=locate(t,id);if(p)S.ch[t][p[0]].splice(p[1],1)}

function flush(){sch=false;

if(!IDB){opq.clear();replaceT.clear();pendCfg=null;return}

function pickFile(f){const rd=new FileReader();rd.onload=()=>{try{pend=importCheck(JSON.parse(rd.result));$('#rsi').innerHTML=`<div class="warn">سيتم استبدال بياناتك الحالية (${curTotal()} سجل) بـ ${pend.total} سجل من الملف${pend.at?' (نسخة بتاريخ '+esc(pend.at)+')':''}.</div>${pend.total<curTotal()?'<div class="er">⚠ الملف فيه سجلات أقل من اللي عندك دلوقتي — اتأكد إنه أحدث نسخة قبل ما تأكد.</div>':''}${pend.dropped?`<div class="er">⚠ ${pend.dropped} سجل في الملف ناقص أو غير صالح وهيتم تجاهله.</div>`:''}<button class="btn d" data-act="rs">تأكيد الاستبدال</button>`}catch(e){pend=null;$('#rsi').innerHTML=`<div class="er">${esc(e&&e.name==='SyntaxError'?'الملف ليس نسخة احتياطية صالحة (مش ملف JSON سليم)':(e&&e.message)||'ملف غير صالح')}</div>`}};rd.onerror=()=>{$('#rsi').innerHTML='<div class="er">تعذّرت قراءة الملف</div>'};rd.readAsText(f)}
async function doRestore(){if(!pend)return;if(!IDB){toast('التخزين غير متاح — الاسترجاع مش آمن دلوقتي');return}const d=pend;pend=null;
try{await saveSnap()}catch(e){pend=d;toast('تعذّر حفظ نسخة أمان من بياناتك الحالية — خد نسخة احتياطية الأول');return}
toast('جارٍ حفظ البيانات على الجهاز… ماتقفلش التطبيق');applyData(d);render();
const w=await whenIdle();if(w&&!failed)toast('تم الاسترجاع ✓ — نسخة أمان من بياناتك القديمة محفوظة في الإعدادات');else toast('⚠ الحفظ على الجهاز لسه ما خلصش — سيب التطبيق مفتوح وراجع حالة الحفظ')}
async function restoreSnap(){if(!IDB)return;let d;try{d=await idbGet('zz-snap')}catch(e){d=null}if(!d||!d.t){toast('مفيش نسخة أمان');return}
const keep={cfg:d.cfg,t:d.t};try{await saveSnap()}catch(e){toast('تعذّر حفظ نسخة أمان للحالة الحالية');return}
toast('جارٍ حفظ البيانات على الجهاز… ماتقفلش التطبيق');applyData(keep);render();
const w=await whenIdle();if(w&&!failed)toast('تم استرجاع نسخة الأمان ✓');else toast('⚠ الحفظ على الجهاز لسه ما خلصش — سيب التطبيق مفتوح')}
const curTotal=()=>Object.keys(S.ch).reduce((a,t)=>a+rows(t).length,0);
function snapCard(){const s=hasSnap;if(!s)return'';const n=Object.values(s.counts).reduce((a,b)=>a+b,0);let w='';try{w=new Date(s.at).toLocaleString('ar-EG-u-nu-latn')}catch(e){}
return `<div class="cd"><b>🛟 نسخة أمان قبل آخر استرجاع</b><div class="mu">${esc(w)} · ${n} سجل</div></div><div class="acts"><button class="btn s" data-act="rsnap">استرجاع نسخة الأمان دي</button></div>`}
function saveAllCfg(){const nc={...S.cfg};
for(const el of document.querySelectorAll('[data-cfg]')){const k=el.dataset.cfg,pct=/Pct$/.test(k);let v=Number(el.value);
if(el.value===''||!isFinite(v)||v<0||(pct&&v>100)||(!pct&&/Days$|Age$|Cycle$/.test(k)&&v<1)){const f=CFGL.find(x=>x[0]===k);toast('قيمة غير صالحة: '+(f?f[1]:k));return}nc[k]=pct?v/100:v}
if(nc.PoorRatePct>nc.GoodRatePct){toast('نسبة الضعيف لازم تكون أقل من الممتاز');return}
if(nc.MinWeanDays>nc.WeaningAge){toast('أقل مدة للفطام لازم تكون أقل من أو تساوي سن الفطام');return}
if(nc.MaxBirthDays<nc.GestationDays){toast('أقصى مدة للولادة لازم تكون أكبر من أو تساوي مدة الحمل');return}
S.cfg=nc;qc();S.v++;toast('تم حفظ الإعدادات ✓');render()}
async function updateApp(){toast('جارٍ التحديث…');try{for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();for(const k of await caches.keys())await caches.delete(k)}catch(e){}location.reload()}
function doAct(a,el){if(a==='retry')return retryBoot();if(a==='reload')return location.reload();if(a==='rerender'){render();return}if(a==='rawbk')return rawBackup();if(a==='nosave'){loadErr=null;render();return}if(a==='upd')return updateApp();if(a==='svc')return saveAllCfg();if(a==='nf')return enableNotif();if(a==='nt')return notifyDue(1);if(a==='ics')return exportIcs();if(a==='shr')return shareApp();if(a==='ins')return installApp();
if(a==='bk')return doBackup();
if(a==='autores'){if(!el.dataset.arm){el.dataset.arm='1';const o=el.textContent;el.textContent='اضغط مرة تانية للتأكيد';setTimeout(()=>{el.dataset.arm='';el.textContent=o},3000);return}return restoreAuto(+el.dataset.slot)}
if(a==='lossok'){lossWarn=null;const L2={t:rowsNow(),at:Date.now()};lastSet(L2);dg('loss warning dismissed by user');render();return}
if(a==='rsnap'){if(!el.dataset.arm){el.dataset.arm='1';el.textContent='اضغط مرة أخرى للتأكيد';setTimeout(()=>{el.dataset.arm='';el.textContent='استرجاع نسخة الأمان دي'},3000);return}return restoreSnap()}
if(a==='rs')return doRestore();
if(a==='rst'){if(!el.dataset.arm){el.dataset.arm='1';el.textContent='اضغط مرة أخرى للتأكيد';setTimeout(()=>{el.dataset.arm='';el.textContent='استرجاع القيم الافتراضية'},3000);return}S.cfg={...DEF};qc();S.v++;toast('تم الاسترجاع');render()}}

/* ---------- phone notifications, calendar, install ---------- */
const NP=()=>'Notification' in window?Notification.permission:'na';
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone;
let dip=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;if(tab==='set'&&!FS)render()});addEventListener('appinstalled',()=>{dip=null});
function notifV(){const p=NP(),ios=/iphone|ipad/i.test(navigator.userAgent);
const st=p==='granted'?'✅ إشعارات الجوال مفعّلة':p==='denied'?'⛔ الإشعارات مرفوضة — فعّلها من إعدادات الجوال':'🔕 الإشعارات غير مفعّلة';
return `<h3>التنبيهات على الجوال</h3><div class="cd"><b>${st}</b><div class="mu">${ios&&!standalone()?'على الآيفون: ثبّت التطبيق الأول (مشاركة ← إضافة إلى الشاشة الرئيسية) وافتحه من الأيقونة عشان الإشعارات تشتغل.':'بيوصلك إشعار بالمواعيد العاجلة لما تفتح التطبيق، وكمان كل يوم تلقائيًا على أندرويد.<br>لتغيير نغمة الإشعار: إعدادات الجوال ← التطبيقات ← Rabbit Farm ← الإشعارات ← الصوت.'}</div></div><div class="acts"><button class="btn" data-act="nf">تفعيل الإشعارات</button><button class="btn s" data-act="nt">إشعار تجريبي</button></div>
<div class="cd"><b>📅 منبهات تشتغل والتطبيق مقفول</b><div class="mu">ضيف مواعيد الجسات والولادة والفطام والتحصينات (لـ 45 يوم جاي) لتقويم الجوال، فيرن عليك المنبه الساعة 9 الصبح على أندرويد وآيفون. كرّرها كل شهر أو بعد تسجيل تلقيحات جديدة.</div></div><div class="acts"><button class="btn" data-act="ics">إضافة المواعيد للتقويم</button></div>
<div class="acts"><button class="btn s" data-act="shr">مشاركة التطبيق</button>${dip?'<button class="btn s" data-act="ins">تثبيت التطبيق</button>':''}</div>`}
async function installApp(){if(!dip)return;dip.prompt();await dip.userChoice.catch(()=>0);dip=null;render()}
async function shareApp(){const u=location.href.split('#')[0];try{if(navigator.share)await navigator.share({title:'Rabbit Farm',text:'تطبيق متابعة المزرعة',url:u});else{await navigator.clipboard.writeText(u);toast('اتنسخ رابط التطبيق')}}catch(e){}}
async function reg2(){try{const r=await navigator.serviceWorker.ready;if(r.periodicSync)await r.periodicSync.register('rf-daily',{minInterval:12*36e5})}catch(e){}}
async function enableNotif(){if(!('Notification' in window)){toast('المتصفح ده مش بيدعم الإشعارات');return}
try{const p=await Notification.requestPermission();if(p==='granted'){reg2();notifyDue(1)}else toast('لم يتم السماح بالإشعارات')}catch(e){toast('تعذّر تفعيل الإشعارات')}render()}
async function notifyDue(force){if(NP()!=='granted'){if(force)toast('فعّل الإشعارات أولًا');return}
if(!force){try{if(localStorage.rf_nd===todayS())return}catch(e){}}
const nt=Core.dueNote(alerts(view(),S.cfg,T0())),body=nt.body;if(!body&&!force)return;
if(!force){try{localStorage.rf_nd=todayS()}catch(e){}}
const o={body:body||'مفيش حالات عاجلة النهاردة ✓',tag:'rf-daily',icon:'icon-192.png',badge:'badge-96.png',vibrate:[200,100,200],lang:'ar',dir:'rtl'};
try{const r=await navigator.serviceWorker.ready;await r.showNotification(nt.title,o)}catch(e){try{new Notification(nt.title,o)}catch(_){}}}
async function exportIcs(){const ics=Core.ics(view(),S.cfg,T0());if(!ics){toast('مفيش مواعيد خلال الـ 45 يوم الجاية');return}const r=await shareFile('rabbit-farm-reminders.ics','text/calendar',ics,'مواعيد Rabbit Farm');if(r===1)toast('افتح الملف واختر «إضافة للتقويم»');else if(r===0)toast('تعذّر تجهيز الملف')}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-open],[data-add],[data-sub],[data-more],[data-vac],[data-go],[data-tab],[data-act],#shx,#sv,#dl,#sheet');if(!el)return;const d=el.dataset;
if(el.id==='sheet'){if(e.target===el)closeSheet();return}
if(el.id==='shx')return closeSheet();if(el.id==='sv')return save();
if(el.id==='dl'){if(el.dataset.arm)return delRec();el.dataset.arm='1';el.textContent='اضغط مرة أخرى للتأكيد';setTimeout(()=>{el.dataset.arm='';el.textContent='حذف'},3000);return}
if(d.tab)return go(d.tab);
if(d.sub){sub[tab]=d.sub;q='';flt='';pg=1;return render()}
if(d.go){const[a,b,c]=d.go.split('|');return go(a,b,c)}
if(d.more){pg++;return fillList()}
if(d.add)return openForm(d.add);
if(d.open){const[t,id]=d.open.split('|');return openForm(t,id)}
if(d.vac)return quickVac(d.vac);
if(d.act)return doAct(d.act,el)});
document.addEventListener('click',e=>{
const b=e.target.closest('[data-ddo]');
if(b){const l=b.closest('.dd').querySelector('.ddl'),op=l.hidden;document.querySelectorAll('.ddl').forEach(x=>{x.hidden=true});l.hidden=!op;
if(op){const s=l.querySelector('.dds');s.value='';l.querySelectorAll('.ddo').forEach(x=>{x.hidden=false});try{l.scrollIntoView({block:'nearest',behavior:'smooth'})}catch(_){}}return}
const o=e.target.closest('[data-ddv]');if(!o)return;
const dd=o.closest('.dd'),v=o.dataset.ddv,h=dd.querySelector('input[type=hidden]'),n=document.getElementById('f_cu_new');
if(v==='__new'){h.value='';dd.querySelector('.ddv').textContent='＋ زبون جديد';if(n){n.hidden=false;n.focus()}}
else{h.value=v;dd.querySelector('.ddv').textContent=v||'— بدون —';if(n){n.hidden=true;n.value=''}}
dd.querySelectorAll('.ddo').forEach(x=>{x.classList.remove('sel');const s=x.querySelector('span');if(s)s.remove()});
if(v&&v!=='__new'){o.classList.add('sel');o.insertAdjacentHTML('beforeend','<span>✓</span>')}
dd.querySelector('.ddl').hidden=true;h.dispatchEvent(new Event('change',{bubbles:true}))});
document.addEventListener('input',e=>{const t=e.target;if(t.classList&&t.classList.contains('dds')){const s=t.value.trim().toLowerCase();
t.closest('.ddl').querySelectorAll('.ddo').forEach(b=>{b.hidden=!!s&&b.dataset.ddv!=='__new'&&!b.textContent.toLowerCase().includes(s)})}});
document.addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('button,label.btn')){try{navigator.vibrate&&navigator.vibrate(8)}catch(_){}}},{passive:true});
let qt=0;
document.addEventListener('input',e=>{const t=e.target;if(t.id==='q'){q=t.value;pg=1;clearTimeout(qt);qt=setTimeout(fillList,150)}else if(FS&&t.closest&&t.closest('#fm'))pv()});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='flt'){flt=t.value;pg=1;fillList()}else if(t.dataset&&t.dataset.cfg){}else if(t.id==='rf'){if(t.files&&t.files[0])pickFile(t.files[0])}else if(FS&&t.closest&&t.closest('#fm'))pv()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;syncAll();notifyDue();if(!FS)render()});
let dayKey=todayS();setInterval(()=>{const n=todayS();if(n!==dayKey){dayKey=n;if(!FS&&ready)render()}},30000);
window.RF={loss:()=>lossWarn,autoSnap,autoMeta:()=>autoMeta,rowsNow,S,put,del,go,render,openForm,save,rows,fillList,validate,items,brCheck:Core.brCheck,flow:Core.brFlow,idle:()=>!opq.size&&!replaceT.size&&!pendCfg&&!running.length&&!sch};
let errToast=false;const onErr=m=>{dg('error: '+m);if(!errToast){errToast=true;try{toast('حصل خطأ غير متوقع — لو اتكرر ابعت صورة من الإعدادات ← معلومات تقنية')}catch(_){}}};
addEventListener('error',e=>onErr(e&&e.message));addEventListener('unhandledrejection',e=>onErr(e&&e.reason&&e.reason.message||e.reason));
render();setTimeout(()=>{if(!ready){slow=true;render()}},TO.slow);boot().then(()=>{if(NP()==='granted'){reg2();notifyDue()}}).catch(e=>dg('boot crashed: '+(e&&e.message)));
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>0));
})();
